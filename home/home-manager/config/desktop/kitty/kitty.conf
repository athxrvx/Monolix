# Kuro central settings: colors, fonts, cursor, opacity and tabs.
# Edit ~/.config/kuro/kuro.toml instead of this file; kurogen fills kuro.conf.
include ~/.config/kitty/kuro.conf

# =========================
# Window
# =========================
confirm_os_window_close 0
remember_window_size no
initial_window_width  1000
initial_window_height 600
