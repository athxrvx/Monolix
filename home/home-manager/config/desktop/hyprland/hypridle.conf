# Lock after five idle minutes, turn displays off after ten, lock before sleep.
# hypridle runs as a NixOS systemd user service; lock_cmd hands off to Quickshell.

general {
    lock_cmd = qs -c shell ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
