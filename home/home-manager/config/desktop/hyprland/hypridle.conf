# Lock after 15 idle minutes, turn the display off after ten, suspend after sixteen.
# Lock before every sleep; Caffeine defers all idle actions while active.

general {
    lock_cmd = @QS@ -c shell ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = @QS@ -c shell ipc call idle screenOn
    inhibit_sleep = 3
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
    condition_cmd = test "$(@QS@ -c shell ipc call caffeine state 2>/dev/null)" != on
    condition_retry = 30
}

listener {
    timeout = 600
    on-timeout = @QS@ -c shell ipc call idle screenOff
    on-resume = @QS@ -c shell ipc call idle screenOn
    condition_cmd = test "$(@QS@ -c shell ipc call caffeine state 2>/dev/null)" != on
    condition_retry = 30
}

listener {
    timeout = 960
    on-timeout = @SYSTEMCTL@ suspend
    condition_cmd = test "$(@QS@ -c shell ipc call caffeine state 2>/dev/null)" != on
    condition_retry = 30
}
